AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Job Automation Agent - admin dashboard + storage (AWS Free Tier).
  Deploys: 2 DynamoDB tables (Jobs, Applications), 1 private S3 bucket
  (tailored resumes/cover letters), and 1 Lambda function serving the
  FastAPI dashboard behind an HTTP API. This stack is READ-ONLY toward
  LinkedIn/Indeed - it never scrapes or applies to jobs. Job scraping and
  applying run LOCALLY on the operator's own machine/network, per
  TECHNICAL_PLAN.txt section 6 (avoids the datacenter-IP ban signal); the
  local process writes results here so the dashboard can show them.

Globals:
  Function:
    Timeout: 15
    MemorySize: 256
    Runtime: python3.13

Parameters:
  StageName:
    Type: String
    Default: prod
    Description: Deployment stage, used to namespace resource names.
  DashboardUsername:
    Type: String
    Default: admin
    Description: Login username for the dashboard.
  DashboardPassword:
    Type: String
    NoEcho: true
    Description: Login password for the dashboard - required, no default. Pass via --parameter-overrides, never commit it.
  SessionSecret:
    Type: String
    NoEcho: true
    Description: Random secret used to sign session cookies - required, no default. Pass via --parameter-overrides, never commit it.

Resources:
  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub job-automation-jobs-${StageName}
      # 5/5 provisioned capacity fits comfortably under DynamoDB's
      # always-free tier (25 RCU/25 WCU + 25 GB storage) at hobby scale.
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH

  ApplicationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub job-automation-applications-${StageName}
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH

  ProjectBankTable:
    Type: AWS::DynamoDB::Table
    Properties:
      # Static reference data (project ideas by tech stack, see
      # project_bank.json / scripts/load_project_bank_to_dynamodb.py) -
      # not user-specific, loaded once and read-only after that. 15/15
      # total provisioned RCU/WCU across all 3 tables now, still under
      # DynamoDB's always-free 25/25 threshold.
      TableName: !Sub job-automation-project-bank-${StageName}
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  ResumeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub job-automation-resumes-${AWS::AccountId}-${StageName}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  DashboardFunction:
    Type: AWS::Serverless::Function
    Properties:
      # CodeUri points at a STAGED, explicitly allow-listed copy of only
      # what the dashboard needs (src/common, src/storage, src/dashboard)
      # - see prepare_lambda_src.py. Do NOT point this at the repo root:
      # verified empirically (2026-09-08) that relying on .samignore to
      # exclude personal files (resume, .env, credential CSVs) from a
      # repo-root CodeUri does not reliably work with SAM's Python
      # builder - it copied the whole repo, secrets included, into the
      # build artifact despite .samignore listing them. Run
      # `python prepare_lambda_src.py` (from this directory) before every
      # `sam build` - see README.md's deploy instructions.
      CodeUri: .lambda_src
      Handler: src.dashboard.app.handler
      Environment:
        Variables:
          STORAGE_BACKEND: aws
          DYNAMODB_JOBS_TABLE: !Ref JobsTable
          DYNAMODB_APPLICATIONS_TABLE: !Ref ApplicationsTable
          PROJECT_BANK_TABLE: !Ref ProjectBankTable
          S3_BUCKET_NAME: !Ref ResumeBucket
          # Where scripts/upload_master_resume.py puts the operator's real
          # resume (PII) in this same private/encrypted bucket, so the
          # on-demand "Tailor Resume" button can render a fresh PDF from
          # inside this Lambda too - see src/tailoring/engine.py.
          MASTER_RESUME_S3_KEY: private/master_resume.json
          # Same pattern, for the headshot in the PDF header - see
          # scripts/upload_profile_photo.py.
          PROFILE_PHOTO_S3_KEY: private/photo.jpg
          DASHBOARD_USERNAME: !Ref DashboardUsername
          DASHBOARD_PASSWORD: !Ref DashboardPassword
          SESSION_SECRET: !Ref SessionSecret
      Policies:
        # Mostly read-only: the dashboard displays results; the local
        # ingest pipeline writes new job/application records via its own
        # separately-issued AWS credentials (see TECHNICAL_PLAN.txt Phase
        # 3 IAM notes). Narrow write exceptions, all plain data writes
        # triggered by a human clicking something in the dashboard - not
        # scraping/automation, so allowed on AWS unlike Settings'
        # local-only actions:
        #   - UpdateItem on Applications: "Mark Applied" AND "Tailor
        #     Resume" buttons (a human flagging an application as
        #     applied, or re-tailoring their own resume for one job -
        #     neither is an apply bot).
        #   - DeleteItem on Applications: the Applications page's bulk
        #     "Delete selected" action (a human cleaning up their own
        #     list - same "not automation" reasoning as UpdateItem above,
        #     added alongside src.storage.dynamo_store.DynamoStore.delete_application).
        #   - PutItem/DeleteItem on ProjectBank: the /projects page's
        #     Add/Edit/Delete actions (static reference data, not user
        #     PII - Edit is just PutItem again, upsert by id).
        #   - PutObject on ResumeBucket ("resumes/*" only, never
        #     "private/*" - the Lambda only ever READS the master resume
        #     back, it has no route that would let it overwrite that
        #     copy): "Tailor Resume" uploading the freshly rendered PDF.
        - DynamoDBReadPolicy:
            TableName: !Ref JobsTable
        - DynamoDBReadPolicy:
            TableName: !Ref ApplicationsTable
        - DynamoDBReadPolicy:
            TableName: !Ref ProjectBankTable
        - S3ReadPolicy:
            BucketName: !Ref ResumeBucket
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
              Resource: !GetAtt ApplicationsTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:DeleteItem
              Resource: !GetAtt ProjectBankTable.Arn
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource: !Sub "${ResumeBucket.Arn}/resumes/*"
      Events:
        RootGet:
          Type: HttpApi
          Properties:
            Path: /
            Method: GET
        ProxyAny:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY

Outputs:
  DashboardUrl:
    Description: Public URL of the admin dashboard
    Value: !Sub https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/
  JobsTableName:
    Value: !Ref JobsTable
  ApplicationsTableName:
    Value: !Ref ApplicationsTable
  ProjectBankTableName:
    Value: !Ref ProjectBankTable
  ResumeBucketName:
    Value: !Ref ResumeBucket
