<!--
Schematic reconstruction of a LinkedIn guest job-search page, using the
real class names/attributes verified against the live site 2026-09-11
(see src/scrapers/linkedin.py docstring). Not a captured copy of the
actual page — trimmed to the structural contract the parser depends on,
with the noisy generated CSS/tracking removed.
-->
<html>
<body>
<ul>
  <li>
    <div class="base-card base-search-card base-search-card--link job-search-card" data-entity-urn="urn:li:jobPosting:1001">

        <span class="sr-only">Full Stack Developer</span>
      </a>
      <div class="base-search-card__info">
        <h3 class="base-search-card__title">Full Stack Developer</h3>
        <h4 class="base-search-card__subtitle">
          <a class="hidden-nested-link" href="https://www.linkedin.com/company/acme-corp">Acme Corp</a>
        </h4>
        <div class="base-search-card__metadata">
          <span class="job-search-card__location">Remote</span>
          <time class="job-search-card__listdate" datetime="2026-09-08">2 days ago</time>
        </div>
      </div>
    </div>
  </li>
  <li>
    <div class="base-card base-search-card base-search-card--link job-search-card" data-entity-urn="urn:li:jobPosting:1002">
      <a class="base-card__full-link" href="https://www.linkedin.com/jobs/view/senior-react-developer-at-globex-inc-1002?position=2&amp;pageNum=0&amp;trackingId=def">

      <div class="base-search-card__info">
        <h3 class="base-search-card__title">Senior React Developer</h3>

        </h4>
        <div class="base-search-card__metadata">
          <span class="job-search-card__location">Chicago, IL</span>
          <time class="job-search-card__listdate" datetime="2026-08-01">1 month ago</time>
        </div>
      </div>
    </div>
  </li>
  <li>
    <!-- edge case: no full-link href (promoted/placeholder card) should be skipped, not crash -->

      <div class="base-search-card__info">
        <h3 class="base-search-card__title">Sponsored Placeholder</h3>

</html>
