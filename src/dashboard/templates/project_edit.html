{% extends "base.html" %}
{% block title %}Edit Project — Job Automation{% endblock %}
{% block head %}
<style>
  h1 { margin: 0 0 4px; font-size: 1.4rem; }
  .sub { color: var(--muted); font-size: .85rem; margin-bottom: 18px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-grid .span-2 { grid-column: 1 / -1; }
  @media (max-width: 700px) { .form-grid { grid-template-columns: 1fr; } }
  .form-grid input, .form-grid select, .form-grid textarea { width: 100%; }
  .form-grid textarea { min-height: 70px; resize: vertical; font-family: inherit; }
  .actions-row { display: flex; gap: 10px; margin-top: 16px; align-items: center; }
  .btn.danger { background: var(--failed); border-color: var(--failed); }
  .btn.danger:hover { opacity: .9; }
</style>
{% endblock %}
{% block content %}
<h1>Edit Project</h1>
<div class="sub">{{ project.id }}</div>

<div class="card" style="padding: 18px 20px;">
  <form method="post" action="/api/project-bank/{{ project.id }}">
    <div class="form-grid">
      <div>
        <label>Title</label>
        <input name="title" required value="{{ project.title }}">
      </div>
      <div>
        <label>Stack key</label>
        <input name="stack" required value="{{ project.stack }}">
      </div>
      <div>
        <label>Stack label (display name)</label>
        <input name="stack_label" required value="{{ project.stack_label }}">
      </div>
      <div>
        <label>Category</label>
        <input name="category" value="{{ project.category }}">
      </div>
      <div class="span-2">
        <label>Tools (comma or newline separated)</label>
        <input name="tools" required value="{{ tools_text }}">
      </div>
      <div>
        <label>Estimated effort</label>
        <input name="estimated_effort" value="{{ project.estimated_effort }}">
      </div>
      <div class="span-2">
        <label>Description</label>
        <textarea name="description" required>{{ project.description }}</textarea>
      </div>
      <div class="span-2">
        <label>Features (one per line)</label>
        <textarea name="features" required>{{ features_text }}</textarea>
      </div>
    </div>
    <div class="actions-row">
      <button class="btn" type="submit">Save changes</button>
      <a class="btn secondary" href="/projects">Cancel</a>
    </div>
  </form>

  <form method="post" action="/api/project-bank/{{ project.id }}/delete"
        onsubmit="return confirm('Delete this project idea permanently? This cannot be undone.');"
        style="margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border);">
    <button class="btn danger" type="submit">Delete this project</button>
  </form>
</div>
{% endblock %}
