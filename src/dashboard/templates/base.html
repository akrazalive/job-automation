<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Job Automation — Admin Dashboard{% endblock %}</title>
<style>
  :root {
    --bg: #f5f9f6; --panel: #ffffff; --text: #16241a; --muted: #5b6b60;
    --border: #dbe8df; --accent: #16a34a; --accent-dark: #15803d;
    --accent-light: #dcfce7; --accent-contrast: #ffffff;
    --applied: #16a34a; --failed: #dc2626; --blocked: #d97706;
    --skipped: #6b7280; --pending: #0891b2;
    --shadow: 0 1px 2px rgba(20, 40, 28, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1410; --panel: #131d16; --text: #e8f2ea; --muted: #93a89b;
      --border: #203024; --accent: #22c55e; --accent-dark: #16a34a;
      --accent-light: #143621; --accent-contrast: #06210f;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  a { color: var(--accent-dark); }
  nav.topnav {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap; padding: 14px 24px;
    background: var(--panel); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10;
  }
  nav.topnav .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 1rem; color: var(--text); text-decoration: none; }
  nav.topnav .brand .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); display: inline-block; }
  nav.topnav .links { display: flex; gap: 4px; flex-wrap: wrap; }
  nav.topnav .links a {
    padding: 7px 12px; border-radius: 8px; text-decoration: none; font-size: .85rem;
    color: var(--muted); font-weight: 600;
  }
  nav.topnav .links a:hover { background: var(--accent-light); color: var(--accent-dark); }
  nav.topnav .links a.active { background: var(--accent); color: var(--accent-contrast); }
  main { max-width: 1200px; margin: 0 auto; padding: 20px 24px 48px; }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; box-shadow: var(--shadow);
  }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    padding: 8px 14px; border-radius: 8px; border: 1px solid var(--accent);
    background: var(--accent); color: var(--accent-contrast); font-size: .85rem;
    font-weight: 600; text-decoration: none;
  }
  .btn:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
  .btn.secondary { background: var(--panel); color: var(--accent-dark); }
  .btn.secondary:hover { background: var(--accent-light); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  input, select, textarea {
    padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); font-size: .85rem; font-family: inherit;
  }
  label { display: block; font-size: .7rem; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .03em; }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: .72rem; font-weight: 600; color: #fff; white-space: nowrap; }
  .badge.applied { background: var(--applied); }
  .badge.failed { background: var(--failed); }
  .badge.blocked { background: var(--blocked); }
  .badge.skipped_duplicate { background: var(--skipped); }
  .badge.pending { background: var(--pending); }
  .tag {
    display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: .7rem;
    background: var(--accent-light); color: var(--accent-dark); margin: 1px 2px 1px 0; font-weight: 600;
  }
  .muted { color: var(--muted); }
  @media (max-width: 640px) {
    main { padding: 14px 12px 32px; }
    nav.topnav { padding: 10px 14px; }
  }
</style>
{% block head %}{% endblock %}
</head>
<body>
<nav class="topnav">
  <a class="brand" href="/"><span class="dot"></span> Job Automation</a>
  <div class="links">
    <a href="/" class="{{ 'active' if active == 'dashboard' else '' }}">Dashboard</a>
    <a href="/settings" class="{{ 'active' if active == 'settings' else '' }}">Settings</a>
    <a href="/logout">Logout</a>
  </div>
</nav>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
