<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Job Automation — Admin Dashboard{% endblock %}</title>
<style>
  :root {
    --bg: #f5f9f6; --panel: #ffffff; --text: #16241a; --muted: #5b6b60;
    --border: #dbe8df; --accent: #16a34a; --accent-dark: #15803d;
    --accent-light: #dcfce7; --accent-contrast: #ffffff;
    --applied: #16a34a; --failed: #dc2626; --blocked: #d97706;
    --skipped: #6b7280; --pending: #0891b2;
    --shadow: 0 1px 2px rgba(20, 40, 28, .06);
    --sidebar-w: 232px; --sidebar-w-collapsed: 68px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1410; --panel: #131d16; --text: #e8f2ea; --muted: #93a89b;
      --border: #203024; --accent: #22c55e; --accent-dark: #16a34a;
      --accent-light: #143621; --accent-contrast: #06210f;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  a { color: var(--accent-dark); }

  .app-shell { display: flex; min-height: 100vh; }

  .sidebar {
    width: var(--sidebar-w); flex-shrink: 0; background: var(--panel);
    border-right: 1px solid var(--border); display: flex; flex-direction: column;
    position: sticky; top: 0; height: 100vh; overflow-y: auto; overflow-x: hidden;
    transition: width .15s ease; z-index: 10;
  }
  .sidebar.collapsed { width: var(--sidebar-w-collapsed); }

  .sidebar-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 14px; border-bottom: 1px solid var(--border); gap: 6px; min-height: 60px;
  }
  .sidebar-header .brand {
    display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: .95rem;
    color: var(--text); text-decoration: none; overflow: hidden; white-space: nowrap;
  }
  .sidebar-header .brand .logo-badge { color: var(--accent); flex-shrink: 0; display: flex; }
  .sidebar.collapsed .sidebar-header .brand .label { display: none; }
  .sidebar-toggle {
    background: none; border: none; cursor: pointer; color: var(--muted); padding: 7px;
    border-radius: 7px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  }
  .sidebar-toggle:hover { background: var(--accent-light); color: var(--accent-dark); }

  .sidebar-nav { flex: 1; padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; }
  .sidebar-nav a, .sidebar-footer a {
    display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px;
    text-decoration: none; color: var(--muted); font-weight: 600; font-size: .86rem;
    white-space: nowrap; overflow: hidden;
  }
  .sidebar-nav a svg, .sidebar-footer a svg { flex-shrink: 0; }
  .sidebar-nav a:hover, .sidebar-footer a:hover { background: var(--accent-light); color: var(--accent-dark); }
  .sidebar-nav a.active { background: var(--accent); color: var(--accent-contrast); }
  .sidebar.collapsed .sidebar-nav a .label,
  .sidebar.collapsed .sidebar-footer a .label { display: none; }
  .sidebar.collapsed .sidebar-nav a,
  .sidebar.collapsed .sidebar-footer a { justify-content: center; }

  .sidebar-footer { padding: 10px; border-top: 1px solid var(--border); }

  .main-wrap { flex: 1; min-width: 0; }
  .main-content { padding: 36px; max-width: 1280px; margin: 0 auto; }
  .main-content > * + * { margin-top: 24px; }

  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; box-shadow: var(--shadow); padding: 20px 24px;
  }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    padding: 8px 14px; border-radius: 8px; border: 1px solid var(--accent);
    background: var(--accent); color: var(--accent-contrast); font-size: .85rem;
    font-weight: 600; text-decoration: none;
  }
  .btn:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
  .btn.secondary { background: var(--panel); color: var(--accent-dark); }
  .btn.secondary:hover { background: var(--accent-light); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  input, select, textarea {
    padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); font-size: .85rem; font-family: inherit;
  }
  label { display: block; font-size: .7rem; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .03em; }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: .72rem; font-weight: 600; color: #fff; white-space: nowrap; }
  .badge.applied { background: var(--applied); }
  .badge.failed { background: var(--failed); }
  .badge.blocked { background: var(--blocked); }
  .badge.skipped_duplicate { background: var(--skipped); }
  .badge.pending { background: var(--pending); }
  .tag {
    display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: .7rem;
    background: var(--accent-light); color: var(--accent-dark); margin: 1px 2px 1px 0; font-weight: 600;
  }
  .muted { color: var(--muted); }

  @media (max-width: 860px) {
    .main-content { padding: 18px 16px 32px; }
  }
</style>
{% block head %}{% endblock %}
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <a class="brand" href="/">
        <span class="logo-badge" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none">
            <rect x="1" y="1" width="22" height="22" rx="6.5" fill="currentColor"/>
            <path d="M6.6 12.6l3.4 3.4 7.4-7.6" stroke="var(--panel)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </svg>
        </span>
        <span class="label">Job Automation</span>
      </a>
      <button class="sidebar-toggle" id="sidebar-toggle" title="Collapse menu" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>
    <nav class="sidebar-nav">
      <a href="/" class="{{ 'active' if active == 'dashboard' else '' }}" title="Dashboard">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        <span class="label">Dashboard</span>
      </a>
      <a href="/add-job" class="{{ 'active' if active == 'add_job' else '' }}" title="Add Job">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        <span class="label">Add Job</span>
      </a>
      <a href="/applications" class="{{ 'active' if active == 'applications' else '' }}" title="Applications">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M6 3h8l5 5v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg>
        <span class="label">Applications</span>
      </a>
      <a href="/projects" class="{{ 'active' if active == 'projects' else '' }}" title="Projects">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>
        <span class="label">Projects</span>
      </a>
      <a href="/resumes" class="{{ 'active' if active == 'resumes' else '' }}" title="My Resumes">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M6 3h8l5 5v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><circle cx="12" cy="14" r="3"/><path d="M12 12v.01"/></svg>
        <span class="label">My Resumes</span>
      </a>
      <a href="/scraping" class="{{ 'active' if active == 'scraping' else '' }}" title="Scraping">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <span class="label">Scraping</span>
      </a>
      <a href="/settings" class="{{ 'active' if active == 'settings' else '' }}" title="Settings">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><circle cx="9" cy="6" r="2" fill="currentColor" stroke="none"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="16" cy="12" r="2" fill="currentColor" stroke="none"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="10" cy="18" r="2" fill="currentColor" stroke="none"/></svg>
        <span class="label">Settings</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <a href="/logout" title="Logout">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span class="label">Logout</span>
      </a>
    </div>
  </aside>
  <div class="main-wrap">
    <div class="main-content">
    {% block content %}{% endblock %}
    </div>
  </div>
</div>
<script>
(function() {
  var sidebar = document.getElementById('sidebar');
  var toggle = document.getElementById('sidebar-toggle');
  if (localStorage.getItem('sidebar-collapsed') === '1') sidebar.classList.add('collapsed');
  toggle.addEventListener('click', function() {
    sidebar.classList.toggle('collapsed');
    localStorage.setItem('sidebar-collapsed', sidebar.classList.contains('collapsed') ? '1' : '0');
  });
})();
</script>
</body>
</html>
