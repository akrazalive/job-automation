# What the scrapers search for, and which scrapers run.
#
# NARROWED AGAIN 2026-09-11 (second time same day): direct feedback "why
# on scrape you are going for 120, it should just bring in 20" — the
# previous version of this file crossed 10 role titles x 4 seniority
# levels (none/Senior/Junior/Intermediate) = 40 entries x 3 sources = 120
# searches per cycle. Dropped the seniority cross-product back to one
# search per title (10 entries x 3 sources = 30 searches) — a plain
# "React Developer" search already surfaces Senior/Junior postings
# regardless of the query's own wording (companies title postings however
# they want), so the seniority variants were adding search VOLUME without
# adding much real COVERAGE. If that turns out wrong — e.g. certain sites'
# ranking genuinely surfaces different results for "Senior X" vs "X" —
# ask to have specific titles' seniority variants added back rather than
# restoring all 40 at once.
#
# `category` groups results for the dashboard's category breakdown/report
# and for skill-tag matching context — it's free text, not validated
# against a fixed list. Add/edit entries any time — either by editing this
# file directly, or via the dashboard's Scraping page (local runs only,
# see /scraping -> "Search keywords" -> "Add search").
#
# `sources`: every entry below runs against EVERY listed source, every
# scrape cycle — src/pipeline/ingest.py loops searches x sources. See
# src/scrapers/{simplyhired,indeed,linkedin}.py for what each one actually
# does; all three are SEARCH/READ ONLY (no login, no apply) — see
# TECHNICAL_PLAN.txt Phase 4-6 for why the actual apply bots are a
# separate, much bigger, still-not-started piece of work. indeed and
# linkedin are both known to occasionally show a bot-detection challenge
# page instead of real results (Indeed noticeably more often than LinkedIn
# — see src/scrapers/base.py:looks_blocked() and each scraper's module
# docstring) — that's logged and skipped per-request, not a crash, and not
# something this file's settings can tune away.
sources:
  - simplyhired
  - indeed
  - linkedin

searches:
  - query: "Software Developer"
    location: "Remote"
    category: "general"
  - query: "Web Developer"
    location: "Remote"
    category: "general"
  - query: "Back End Developer"
    location: "Remote"
    category: "backend"
  - query: "Front End Developer"
    location: "Remote"
    category: "frontend"
  - query: "Full Stack Engineer"
    location: "Remote"
    category: "fullstack"
  - query: "Full Stack Developer"
    location: "Remote"
    category: "fullstack"
  - query: "Laravel Developer"
    location: "Remote"
    category: "php"
  - query: "React Developer"
    location: "Remote"
    category: "frontend"
  - query: "WordPress Developer"
    location: "Remote"
    category: "cms"
  - query: "WooCommerce Developer"
    location: "Remote"
    category: "cms"

# Safety limits (see TECHNICAL_PLAN.txt section 6). This caps SEARCH
# volume; APPLY volume gets its own, separate daily/weekly caps in
# config/apply_settings.yaml — don't conflate the two.
max_results_per_search: 8

# Location acceptance rule, applied per job AFTER it's found (this does
# NOT scope the search query itself for Indeed/LinkedIn — see
# src/pipeline/ingest.py's comment on SOURCE location handling for why):
#   - SimplyHired: keep ONLY jobs that look remote with no location
#     restriction (not "Remote - US only" etc.) — best-effort text
#     heuristic, see src/common/location_filters.py:is_globally_remote().
#   - Indeed / LinkedIn: keep a job if it's globally remote OR its
#     location/description mentions one of
#     src/common/location_filters.py:ALLOWED_ONSITE_COUNTRIES (Pakistan,
#     Malaysia, Maldives, Bahrain, Qatar, Kuwait, Oman, Saudi Arabia,
#     Azerbaijan, Armenia, Lithuania, Latvia, Malta, Singapore,
#     Luxembourg) — direct request 2026-09-11. Both checks are
#     best-effort text matching, not a guarantee — see that module's
#     docstring for the known limits.
# Set to false to disable ALL location filtering (every source keeps
# everything found, remote or not, anywhere).
remote_only: true

# Only keep jobs posted within this many days. SimplyHired's and
# LinkedIn's search results expose a date stamp the scrapers parse into an
# absolute UTC datetime (relative "7d"/"20h" for SimplyHired, absolute ISO
# for LinkedIn — see each scraper's parse_date_stamp()/parse_date_iso()).
# Indeed's search DOM doesn't expose a reliably-selectable date at all, so
# its jobs always have an unknown date. A job whose date couldn't be
# determined is kept rather than dropped (better to show it with an
# unknown date than silently lose it).
max_age_days: 7
