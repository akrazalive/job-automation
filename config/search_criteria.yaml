# What the scrapers search for, and which scrapers run.
#
# REPLACED 2026-09-11 per direct request: narrowed from the previous
# 29-entry, every-tech-stack-separately list down to exactly the role
# titles asked for (Software/Web/Back End/Front End/Full Stack Engineer/
# Full Stack/Laravel/React/WordPress/WooCommerce Developer), each run at
# every seniority level (none/Senior/Junior/Intermediate) — 10 titles x 4
# levels = 40 searches. Reasoning given for the narrowing: the specific
# tech-stack skills (Node.js, Vue, Django, Shopify, etc.) don't need their
# own separate search entries — src/common/skills.py already tags whatever
# skills actually show up in a matched job's description, and the resume's
# real skill set (resume/master_resume.json) is what src/tailoring/ reorders
# against at tailor time, not what the search query happened to say. If the
# old broader keyword list is wanted back later, TECHNICAL_PLAN.txt's
# STATUS section 1 (second pass, 2026-09-08) has the original 29 entries to
# restore from.
#
# `category` groups results for the dashboard's category breakdown/report
# and for skill-tag matching context — it's free text, not validated
# against a fixed list. Add/edit entries any time — either by editing this
# file directly, or via the dashboard's Scraping page (local runs only,
# see /scraping -> "Search keywords" -> "Add search").
#
# `sources` (new 2026-09-11): every entry below runs against EVERY listed
# source, every scrape cycle — src/pipeline/ingest.py loops searches x
# sources. See src/scrapers/{simplyhired,indeed,linkedin}.py for what each
# one actually does; all three are SEARCH/READ ONLY (no login, no apply) —
# see TECHNICAL_PLAN.txt Phase 4-6 for why the actual apply bots are a
# separate, much bigger, still-not-started piece of work. indeed and
# linkedin are both known to occasionally show a bot-detection challenge
# page instead of real results (Indeed noticeably more often than LinkedIn
# — see src/scrapers/base.py:looks_blocked() and each scraper's module
# docstring) — that's logged and skipped per-request, not a crash, and not
# something this file's settings can tune away.
sources:
  - simplyhired
  - indeed
  - linkedin

searches:
